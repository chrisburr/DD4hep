[workspace]
channels = [
    "https://prefix.dev/conda-forge",
]
platforms = [
    "linux-64",
    "osx-arm64",
]
preview = ["pixi-build"]

[system-requirements]
libc = { family = "glibc", version = "2.17" }

[workspace.target.linux-64.build-variants]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.17"]

[workspace.target.linux-aarch64.build-variants]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.17"]

[workspace.target.osx-arm64.build-variants]
c_stdlib = ["macosx_deployment_target"]
c_stdlib_version = ["11.0"]

[package]
name = "dd4hep"
version = "1.34.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
extra-args = [
    "-DBUILD_SHARED_LIBS=ON",
    "-DDD4HEP_USE_GEANT4=ON",
    "-DDD4HEP_USE_XERCESC=ON",
    "-DDD4HEP_BUILD_EXAMPLES=OFF",
    "-DDD4HEP_RELAX_PYVER=ON",
    "-DDD4HEP_USE_GEANT4_UNITS=ON",
]

[package.build.target.linux-64.config]
env = { CXXFLAGS = "-march=x86-64-v3", CFLAGS = "-march=x86-64-v3" }

[package.build.target.osx-arm64.config]
env = { CXXFLAGS = "-D_LIBCPP_DISABLE_AVAILABILITY" }

[package.build-dependencies]
git = "*"

[package.host-dependencies]
python = "*"
libboost-devel = "*"
root_base = "*"
root_cxx_standard = "*"
geant4 = "*"
xerces-c = "*"
tbb-devel = "*"

[package.run-dependencies]
python = "*"

[environments]
dev = { features = ["dev"], no-default-feature = true }
pkg = { features = ["pkg"], no-default-feature = true }

[feature.dev.dependencies]
cmake = "*"
ninja = "*"
python = "*"
libboost-devel = "*"
root_base = "*"
root_cxx_standard = "*"
geant4 = "*"
xerces-c = "*"
tbb-devel = "*"

[feature.dev.target.linux-64.dependencies]
gcc = "*"
gxx = "*"

[feature.dev.target.linux-aarch64.dependencies]
gcc = "*"
gxx = "*"

[feature.dev.target.osx-arm64.dependencies]
clang = "*"
clangxx = "*"

[feature.dev.tasks.configure]
cmd = "cmake -GNinja -S. -B.build -DBUILD_SHARED_LIBS=ON -DDD4HEP_USE_GEANT4=ON -DDD4HEP_USE_XERCESC=ON -DDD4HEP_BUILD_EXAMPLES=OFF -DDD4HEP_RELAX_PYVER=ON -DDD4HEP_USE_GEANT4_UNITS=ON $CMAKE_ARGS"
description = "Run CMake configure"
outputs = [".build/CMakeCache.txt"]

[feature.dev.tasks.build]
cmd = "cmake --build .build"
description = "Build the project"
depends-on = ["configure"]

[feature.dev.tasks.test]
cmd = "ctest --output-on-failure"
description = "Build and run tests"
cwd = ".build"
depends-on = ["build"]

[feature.dev.tasks.clean]
cmd = ["rm", "-rf", ".build"]
description = "Remove the build directory"

[feature.dev.tasks.reconfigure]
description = "Clean and re-run CMake configure"
depends-on = ["clean", "configure"]

[feature.dev.activation.env]
CMAKE_ARGS = "-DCMAKE_FIND_ROOT_PATH=$CONDA_PREFIX -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"

[feature.dev.target.linux-64.activation.env]
CXXFLAGS = "-march=x86-64-v3"
CFLAGS = "-march=x86-64-v3"

[feature.pkg.dependencies]
dd4hep = { path = "." }
